server.port=9092

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Gateway
spring.cloud.gateway.server.webmvc.routes[0].id=PRODUCT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/product/**

spring.cloud.gateway.server.webmvc.routes[1].id=CATEGORY-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://CATEGORY-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/category/**
